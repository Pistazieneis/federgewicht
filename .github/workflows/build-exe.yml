# Baut die Windows-.exe auf GitHub. Bei einem Tag (v*) oder manuellem Start mit Version wird ein Release mit Zip erstellt.
name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:           # manuell starten: Actions -> Run workflow, Version eintragen -> erzeugt Release
    inputs:
      version:
        description: 'Release-Version (z.B. v1.0.0), leer = nur bauen'
        required: false
        default: 'v1.0.0'
permissions:
  contents: write            # nötig, damit der Workflow ein Release anlegen darf
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - name: Zip erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/Federgewicht-win32-x64 -DestinationPath Federgewicht-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Federgewicht-Windows
          path: Federgewicht-Windows.zip
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: gh release create "$env:TAG" Federgewicht-Windows.zip --target "${{ github.sha }}" --title "Federgewicht $env:TAG" --notes "Windows-Version. Zip entpacken und Federgewicht.exe starten."
