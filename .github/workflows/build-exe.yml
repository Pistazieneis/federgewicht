# Baut Windows (x64) und die Browser-Version und legt beides als Release ab.
#  * Push auf main      -> nur bauen (Artefakte im Actions-Reiter)
#  * Tag v*             -> bauen + Release mit beiden Dateien
#  * Manuell (Run workflow, Version eintragen) -> bauen + Release
name: Build & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z.B. v1.1.0), leer = nur bauen'
        required: false
        default: ''
permissions:
  contents: write            # nötig, damit der Workflow ein Release anlegen darf

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run package:win
        working-directory: desktop
      - name: Zip erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/Federgewicht-win32-x64 -DestinationPath Federgewicht-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: Federgewicht-Windows, path: Federgewicht-Windows.zip }

  browser:
    # Eine einzelne HTML-Datei (CSS und JS eingebettet): Doppelklick genügt, kein Server nötig.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-browser.py Federgewicht-Browser.html
      - uses: actions/upload-artifact@v4
        with: { name: Federgewicht-Browser, path: Federgewicht-Browser.html }

  release:
    needs: [windows, browser]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" files/Federgewicht-Windows.zip files/Federgewicht-Browser.html \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Federgewicht $TAG" \
            --notes "Windows: Zip entpacken, Federgewicht.exe starten. Browser: Federgewicht-Browser.html herunterladen und per Doppelklick öffnen (läuft auf Windows, Mac und Linux)."
