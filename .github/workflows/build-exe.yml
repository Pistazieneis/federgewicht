# Baut das Spiel für Windows (x64) und macOS (Intel + Apple Silicon) und legt es als Release ab.
#  * Push auf main      -> nur bauen (Artefakte im Actions-Reiter)
#  * Tag v*             -> bauen + Release mit beiden Zips
#  * Manuell (Run workflow, Version eintragen) -> bauen + Release
name: Build & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z.B. v0.1.0), leer = nur bauen'
        required: false
        default: ''
permissions:
  contents: write            # nötig, damit der Workflow ein Release anlegen darf

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'package:win', name: Windows }
          - { os: macos-latest,   script: 'package:mac', name: macOS }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop

      # Windows: ein Zip mit Federgewicht.exe
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Federgewicht-win32-x64 -DestinationPath Federgewicht-Windows.zip

      # macOS: "ditto" erhält die Symlinks im .app-Paket (normales zip würde die App kaputt machen)
      - name: Zips (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Federgewicht-darwin-arm64/Federgewicht.app Federgewicht-macOS-AppleSilicon.zip
          ditto -c -k --sequesterRsrc --keepParent dist/Federgewicht-darwin-x64/Federgewicht.app   Federgewicht-macOS-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Federgewicht-${{ matrix.name }}
          path: Federgewicht-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: zips, merge-multiple: true }
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" zips/*.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Federgewicht $TAG" \
            --notes "Windows: Zip entpacken, Federgewicht.exe starten. macOS: passendes Zip (Apple Silicon = M1 und neuer, Intel = ältere Macs) entpacken, beim ersten Start Rechtsklick auf die App -> Öffnen."
