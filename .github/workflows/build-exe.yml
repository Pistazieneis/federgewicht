# Baut die Windows-.exe auf GitHub. Bei einem Tag wie v1.0.0 wird zusätzlich ein Release mit Zip erstellt.
name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write            # nötig, damit der Workflow ein Release anlegen darf
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - name: Zip erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/Federgewicht-win32-x64 -DestinationPath Federgewicht-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Federgewicht-Windows
          path: Federgewicht-Windows.zip
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" Federgewicht-Windows.zip --title "Federgewicht ${{ github.ref_name }}" --notes "Windows-Version. Zip entpacken und Federgewicht.exe starten."
